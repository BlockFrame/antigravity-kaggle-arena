name: Deploy Documentation to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - "docs/competitions/**"
      - ".github/workflows/deploy-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Assemble versioned wiki
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki_sync
          cp docs/wiki/Home.md wiki_sync/Home.md
          cp docs/wiki/01-mission-and-architecture.md wiki_sync/01-Mission-and-Architecture.md
          cp docs/wiki/02-skills-and-modules.md wiki_sync/02-Skills-and-Modules.md
          cp docs/wiki/03-evolution-playbook.md wiki_sync/03-Evolution-Playbook.md
          cp docs/wiki/Competitions.md wiki_sync/Competitions.md
          cp docs/competitions/playground-series-s6e2.md wiki_sync/Playground-Series-S6E2.md
          cp docs/wiki/PTCG-AI-Battle-Playground.md wiki_sync/PTCG-AI-Battle-Playground.md
          cp docs/wiki/_Sidebar.md wiki_sync/_Sidebar.md
          cp docs/wiki/_Footer.md wiki_sync/_Footer.md

      - name: Push to GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki_sync
