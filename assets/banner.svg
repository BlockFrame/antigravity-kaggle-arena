<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20BEFF"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="150" cy="160" r="130" fill="#38BDF8" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="1050" cy="160" r="140" fill="#818CF8" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="318" rx="15" stroke="#374151" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Trophy Icon Badge -->
  <g transform="translate(100, 85)">
    <rect width="70" height="70" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M 23 20 L 47 20 L 47 34 C 47 41 41 46 35 46 C 29 46 23 41 23 34 Z" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 23 26 L 16 26 C 14 26 12 28 12 30 C 12 34 16 38 23 38" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 47 26 L 54 26 C 56 26 58 28 58 30 C 58 34 54 38 47 38" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 35 46 L 35 53 M 27 53 L 43 53" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitles -->
  <text x="195" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">ANTIGRAVITY KAGGLE ARENA</text>
  <text x="195" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94A3B8">Autonomous Agentic Competitive Machine Learning Framework</text>

  <!-- Tags / Chips -->
  <g transform="translate(195, 175)">
    <!-- Chip 1: Google Antigravity -->
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#38BDF8"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Google Antigravity</text>

    <!-- Chip 2: Multi-Model Ensembles -->
    <rect x="180" y="0" width="180" height="32" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1.2"/>
    <circle cx="196" cy="16" r="5" fill="#818CF8"/>
    <text x="208" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">GBDT + Deep ResMLP</text>

    <!-- Chip 3: Zero-Leakage Pipeline -->
    <rect x="370" y="0" width="165" height="32" rx="16" fill="#1E293B" stroke="#34D399" stroke-width="1.2"/>
    <circle cx="386" cy="16" r="5" fill="#34D399"/>
    <text x="398" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Zero-Leakage Folds</text>

    <!-- Chip 4: World #1 Benchmark -->
    <rect x="545" y="0" width="155" height="32" rx="16" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2"/>
    <circle cx="561" cy="16" r="5" fill="#FBBF24"/>
    <text x="573" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FBBF24">Top 1 Worldwide</text>
  </g>

  <!-- Metric highlight card -->
  <g transform="translate(930, 85)">
    <rect width="180" height="120" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">CURRENT BEST CV</text>
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#38BDF8">0.95536</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FBBF24">🥇 S6E2 Global #1</text>
  </g>
</svg>
